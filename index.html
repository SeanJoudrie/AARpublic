<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AAR — Turn your military experience into a civilian résumé</title>
    <meta
      name="description"
      content="AAR translates military experience into civilian, recruiter-ready language — targeted to any job description. Scores your fit, flags gaps, and drafts your STAR interview answers."
    />
    <meta name="theme-color" content="#e9eae6" />

    <!-- Brass "AAR" tile favicon, inline so there's no extra request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238a6620'/%3E%3Ctext x='16' y='21' font-family='Arial,sans-serif' font-size='11' font-weight='800' text-anchor='middle' fill='%23e9eae6'%3EAAR%3C/text%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238a6620'/%3E%3Ctext x='16' y='21' font-family='Arial,sans-serif' font-size='11' font-weight='800' text-anchor='middle' fill='%23e9eae6'%3EAAR%3C/text%3E%3C/svg%3E" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Open Graph / social preview. __SITE_URL__ is replaced at build time
         from VITE_SITE_URL (see vite.config.ts); without it these fall back to
         page-relative paths, which most — but not all — scrapers resolve. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AAR — After-Action Resume" />
    <meta property="og:title" content="AAR — After-Action Resume" />
    <meta
      property="og:description"
      content="Turn your military experience into a civilian résumé, targeted to the job you want."
    />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="AAR — After-Action Resume. Turn your service into a résumé that reads like the job you want. Match score, keyword gaps, STAR answers."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/og.png" />

</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
