name: Deploy to GitHub Pages

# Publishes the built site to the `gh-pages` branch, which Pages serves from.
#
# Why this route and not actions/deploy-pages: that one requires the Pages site
# to already exist, and it cannot create it — `configure-pages` with
# `enablement: true` fails with "Create Pages site: Resource not accessible by
# integration", because the Actions token can deploy to Pages but not create
# the site. Pushing a `gh-pages` branch enables Pages on its own, with no
# settings step and no elevated token.
#
# The site runs in DEMO MODE until the repository variables below are set
# (Settings → Secrets and variables → Actions → Variables). They are repository
# *variables*, not secrets, on purpose: the Supabase anon key and the Turnstile
# site key are public by design and are compiled into the client bundle. The
# Claude API key is NOT here and must never be — it lives only as a Supabase
# secret on the edge function.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Makes the Open Graph tags absolute so link previews work.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://seanjoudrie.github.io/AARpublic' }}
          VITE_TRANSLATE_URL: ${{ vars.VITE_TRANSLATE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Publish dist/ to gh-pages
        run: |
          set -euo pipefail
          # Required: Jekyll would otherwise drop the Vite chunks whose names
          # start with an underscore (_commonjs-dynamic-modules-*.js) and the
          # app would 404 at runtime.
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
