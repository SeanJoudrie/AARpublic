name: Deploy to GitHub Pages

# `configure-pages` with `enablement: true` turns Pages on via the API using
# this workflow's own token, so nobody has to visit Settings → Pages first.
# That needs the `pages: write` permission below.
#
# The site runs in DEMO MODE until the repository variables below are set
# (Settings → Secrets and variables → Actions → Variables). They are repository
# *variables*, not secrets, on purpose: the Supabase anon key and the Turnstile
# site key are public by design and are compiled into the client bundle. The
# Claude API key is NOT here and must never be — it lives only as a Supabase
# secret on the edge function.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - run: npm run build
        env:
          # Makes the Open Graph tags absolute — configure-pages resolves this
          # to the real site URL, custom domain included.
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_TRANSLATE_URL: ${{ vars.VITE_TRANSLATE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      # Vite emits chunks whose names start with an underscore
      # (_commonjsHelpers-*.js). Pages' artifact path doesn't run Jekyll, but
      # this keeps it true if the deploy ever moves to a branch source.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
